<style>
:root {
  --ink:        #14170F;
  --ink-soft:   #3B4034;
  --ink-faint:  #6B7062;
  --paper:      #E8E4D7;
  --paper-2:    #DFDACB;
  --paper-3:    #D3CDBB;
  --leaf:       #3D7A33;
  --leaf-bg:    #DDE6D3;
  --ore:        #A8521C;
  --ore-bg:     #EFDFCF;
  --steel:      #46697A;
  --steel-bg:   #D9E1E4;
  --rule:       #C3BCA7;
  --shadow:     rgba(20, 23, 15, .10);

  --face-display: "Palatino Linotype", Palatino, "Iowan Old Style", Georgia, serif;
  --face-ui: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --face-data: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;

  --rail: 320px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink:       #E4E2D6;
    --ink-soft:  #B0AE9F;
    --ink-faint: #7E7C6E;
    --paper:     #14170F;
    --paper-2:   #1C2016;
    --paper-3:   #262B1E;
    --leaf:      #8FC47C;
    --leaf-bg:   #23301B;
    --ore:       #DA9058;
    --ore-bg:    #33220F;
    --steel:     #8FB4C4;
    --steel-bg:  #16242B;
    --rule:      #333829;
    --shadow:    rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink:       #E4E2D6;
  --ink-soft:  #B0AE9F;
  --ink-faint: #7E7C6E;
  --paper:     #14170F;
  --paper-2:   #1C2016;
  --paper-3:   #262B1E;
  --leaf:      #8FC47C;
  --leaf-bg:   #23301B;
  --ore:       #DA9058;
  --ore-bg:    #33220F;
  --steel:     #8FB4C4;
  --steel-bg:  #16242B;
  --rule:      #333829;
  --shadow:    rgba(0, 0, 0, .45);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --ink:       #14170F;
  --ink-soft:  #3B4034;
  --ink-faint: #6B7062;
  --paper:     #E8E4D7;
  --paper-2:   #DFDACB;
  --paper-3:   #D3CDBB;
  --leaf:      #3D7A33;
  --leaf-bg:   #DDE6D3;
  --ore:       #A8521C;
  --ore-bg:    #EFDFCF;
  --steel:     #46697A;
  --steel-bg:  #D9E1E4;
  --rule:      #C3BCA7;
  --shadow:    rgba(20, 23, 15, .10);
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--face-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: var(--face-display); font-weight: 600; text-wrap: balance; margin: 0; }

/* Body copy sits on a 68ch measure, which is right for reading but leaves the
   browser free to strand a word or two on the last line. `pretty` lets it look
   ahead and spread the breaks instead; browsers without it wrap as before.   */
p, li { text-wrap: pretty; }

.wrap { max-width: 1440px; margin: 0 auto; padding: 0 20px 72px; }

/* ---------------------------------------------------------- masthead */
.masthead {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px;
  padding: 26px 0 16px; border-bottom: 2px solid var(--ink);
}
.masthead h1 { font-size: 27px; letter-spacing: -.01em; }
.masthead .sub { color: var(--ink-faint); font-size: 13px; }
.masthead .src {
  margin-left: auto; font-family: var(--face-data); font-size: 11px;
  color: var(--ink-faint); letter-spacing: .02em;
}
.langs { display: flex; gap: 10px; font-size: 12px; }
.langs a {
  color: var(--ink-faint); text-decoration: underline;
  text-decoration-color: var(--rule); text-underline-offset: 3px;
}
.langs a:hover { color: var(--ink); text-decoration-color: var(--leaf); }
.langs a[aria-current] { color: var(--ink); font-weight: 600; text-decoration: none; }

/* ---------------------------------------------------------- layout */
.cols { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 24px; } }

/* ---------------------------------------------------------- rail */
.rail { position: sticky; top: 12px; padding-top: 18px; }
@media (max-width: 900px) { .rail { position: static; } }

.rail-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
.rail-head h2 { font-size: 16px; }
.tally {
  margin-left: auto; font-family: var(--face-data); font-size: 12px;
  font-variant-numeric: tabular-nums; color: var(--ink-faint);
}
.tally b { color: var(--leaf); font-weight: 600; margin-left: 4px; }

.progress {
  height: 4px; margin-bottom: 12px; border-radius: 2px;
  background: var(--rule); overflow: hidden;
}
.progress-fill {
  display: block; height: 100%; width: 0; border-radius: 2px;
  background: var(--leaf); transition: width .3s ease;
}
@media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } }

.field {
  width: 100%; padding: 7px 10px; font: inherit; font-size: 14px;
  color: var(--ink); background: var(--paper-2);
  border: 1px solid var(--rule); border-radius: 2px;
}
.field:focus-visible { outline: 2px solid var(--leaf); outline-offset: 1px; }

.btn {
  font: inherit; font-size: 12px; padding: 4px 9px; cursor: pointer;
  color: var(--ink-soft); background: var(--paper-2);
  border: 1px solid var(--rule); border-radius: 2px;
}
.btn:hover { background: var(--paper-3); color: var(--ink); }
.btn:focus-visible { outline: 2px solid var(--leaf); outline-offset: 1px; }

.seedlist {
  margin-top: 10px;
  max-height: 62vh; overflow-y: auto; overflow-x: hidden;
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
}
@media (max-width: 900px) { .seedlist { max-height: 340px; } }

.tiergroup + .tiergroup { margin-top: 2px; }
.tierhead {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; gap: 8px;
  padding: 5px 4px 3px; background: var(--paper);
  border-bottom: 1px solid var(--rule);
  font-family: var(--face-data); font-size: 10.5px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-faint);
}
.tierhead::after { content: ""; flex: 1; }

/* A row is a container, not a button: ticking and opening the panel are two
   separate actions and a button cannot legally nest inside another one.     */
.seed { display: flex; align-items: center; gap: 6px; padding: 0 2px 0 4px; }
.seed:hover { background: var(--paper-2); }

.seed-tick {
  display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
  padding: 3px 0; cursor: pointer; text-align: left;
  font: inherit; font-size: 13.5px; color: var(--ink);
  background: none; border: 0;
}
.seed-tick:focus-visible { outline: 2px solid var(--leaf); outline-offset: -2px; }
.seed-tick .box {
  flex: none; width: 13px; height: 13px; border: 1px solid var(--ink-faint);
  border-radius: 1px; position: relative;
}
.seed-tick[aria-pressed="true"] .box { background: var(--leaf); border-color: var(--leaf); }
.seed-tick[aria-pressed="true"] .box::after {
  content: ""; position: absolute; inset: 2px 2px 3px 2px;
  border-left: 2px solid var(--paper); border-bottom: 2px solid var(--paper);
  transform: rotate(-45deg);
}
.seed-tick[aria-pressed="true"] .nm { font-weight: 600; }
.seed-tick .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* the under-block marker, wherever it appears - rail rows, legend, tips */
.mark { font-family: var(--face-data); font-size: 10px; color: var(--ore); }
.seed .mark { flex: none; }

.seed-info {
  flex: none; width: 16px; height: 16px; padding: 0; cursor: pointer;
  font-family: var(--face-display); font-size: 11px; font-style: italic; line-height: 1;
  color: var(--ink-faint); background: none;
  border: 1px solid var(--rule); border-radius: 50%;
}
.seed-info:hover { color: var(--paper); background: var(--leaf); border-color: var(--leaf); }
.seed-info:focus-visible { outline: 2px solid var(--leaf); outline-offset: 1px; }

.raillegend {
  display: flex; align-items: baseline; gap: 6px;
  margin: 6px 0 0; padding: 0 4px;
  font-size: 11.5px; line-height: 1.4; color: var(--ink-faint);
}
.raillegend .legend-i {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; flex: none;
  font-family: var(--face-display); font-size: 10px; font-style: italic; line-height: 1;
  color: var(--ink-faint); border: 1px solid var(--rule); border-radius: 50%;
}

/* ---------------------------------------------------------- views */
.views { padding-top: 18px; min-width: 0; }

.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--rule); margin-bottom: 4px; }
.tab {
  font: inherit; font-size: 13.5px; padding: 7px 13px 6px; cursor: pointer;
  color: var(--ink-faint); background: none; border: 0;
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--leaf); font-weight: 600; }
.tab:focus-visible { outline: 2px solid var(--leaf); outline-offset: -2px; }
.tab .n {
  font-family: var(--face-data); font-size: 11px; font-variant-numeric: tabular-nums;
  color: var(--ink-faint); margin-left: 5px;
}

/* No measure of its own: everything in the content column shares one right
   edge, so a note never looks like a broken column beside its own table.    */
.viewnote { color: var(--ink-faint); font-size: 13px; margin: 12px 0 16px; }
.viewnote code { font-family: var(--face-data); font-size: 12px; }

.empty {
  padding: 40px 20px; text-align: center; color: var(--ink-faint);
  border: 1px dashed var(--rule); border-radius: 3px; font-size: 14px;
}

/* ---------------------------------------------------------- cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

.card {
  background: var(--paper-2); border: 1px solid var(--rule); border-radius: 3px;
  padding: 11px 13px 12px; display: flex; flex-direction: column; gap: 8px;
  cursor: pointer; position: relative;
}
.card:hover { border-color: color-mix(in srgb, var(--ink-faint) 55%, transparent); }
/* The card you are building. Loud on purpose - the whole point is finding it
   again on a second monitor without reading any of the others.            */
.card.marked {
  background: var(--paper-3); border-color: var(--leaf);
  box-shadow: inset 3px 0 0 var(--leaf);
}
.card.marked .card-out { color: var(--leaf); }
/* the crop names and chips inside stay their normal pointer targets */
.card :is(button, a) { cursor: pointer; }

.card-top { display: flex; align-items: baseline; gap: 8px; }
.card-out {
  font-family: var(--face-display); font-size: 17px; font-weight: 600;
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink);
  text-align: left; text-decoration: underline; text-decoration-color: var(--rule);
  text-underline-offset: 3px;
}
.card-out:hover { text-decoration-color: var(--leaf); }
.card-out:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

.tier {
  flex: none; font-family: var(--face-data); font-size: 10.5px;
  font-variant-numeric: tabular-nums; color: var(--ink-faint);
  border: 1px solid var(--rule); border-radius: 2px; padding: 0 4px;
}

.lbl {
  font-family: var(--face-data); font-size: 9.5px;
  letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint);
}

/* Parents get their own ground, because building the rig means preparing
   three plots. They keep the labels the chips have - a bare list of block
   names cannot say which is the top block - but drop the boxes: chips for
   every parent as well as the result buried the card in chrome. Chips stay
   on the result alone, which is also the ground that has to be exact.    */
.pgroup {
  display: flex; flex-direction: column; gap: 7px;
  padding-top: 8px; border-top: 1px solid var(--rule);
}
.prow { display: flex; flex-direction: column; gap: 1px; align-items: start; }
.pneed { font-family: var(--face-data); font-size: 11px; line-height: 1.55; color: var(--ink-soft); }
.pneed .g { margin-right: 13px; }
.pneed .k {
  font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-faint); margin-right: 4px; white-space: nowrap;
}
.pneed .ore { color: var(--ore); }

.parents { font-size: 13px; color: var(--ink-soft); }
.parents b { font-weight: 600; color: var(--ink); }
.parents .plus { color: var(--ink-faint); margin: 0 3px; }
.parents .miss { color: var(--ore); font-weight: 600; }
/* dotted underline keeps a dense parent list readable while still reading as clickable */
.parents /* one crop name, coloured by whether you hold it - used everywhere */
.inline-crop.own  { font-weight: 600; color: var(--ink); }
.inline-crop.miss { font-weight: 600; color: var(--ore); }
.inline-crop { font: inherit; text-decoration-style: dotted; }
.parents .inline-crop:hover { text-decoration-style: solid; text-decoration-color: var(--leaf); }
.parents .inline-crop.miss { text-decoration-color: color-mix(in srgb, var(--ore) 50%, transparent); }
.parents .inline-crop.miss:hover { text-decoration-color: var(--ore); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  font-size: 11.5px; line-height: 1.35; padding: 2px 7px; border-radius: 2px;
  border: 1px solid transparent; display: inline-flex; gap: 5px; align-items: baseline;
}
.chip .k {
  font-family: var(--face-data); font-size: 9.5px; letter-spacing: .07em;
  text-transform: uppercase; opacity: .75;
}
.chip.soil  { background: var(--leaf-bg);  color: var(--leaf);  border-color: color-mix(in srgb, var(--leaf) 30%, transparent); }
.chip.sub   { background: var(--ore-bg);   color: var(--ore);   border-color: color-mix(in srgb, var(--ore) 32%, transparent); }
.chip.light { background: var(--ore-bg);   color: var(--ore);   border-color: color-mix(in srgb, var(--ore) 32%, transparent); }
.chip.mach  { background: var(--steel-bg); color: var(--steel); border-color: color-mix(in srgb, var(--steel) 34%, transparent); }
.chip.none  { background: none; color: var(--ink-faint); border-color: var(--rule); }

/* ---------------------------------------------------------- roulette */
.pairpick { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 18px; }
.pairpick label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-faint); }
.pairpick select { min-width: 180px; }

/* pairs you have already looked at, and the ones you keep - both sit tight
   under the two dropdowns, since they do the same job faster */
.pairrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pairrow.recent { margin: -8px 0 0; }
.pairrow.saved { margin-top: 6px; }
.pairrow:last-of-type { margin-bottom: 18px; }

/* the pill holds two controls - pick the pair, or keep it - so it is a
   wrapper and the padding lives on the buttons inside it */
.pairchip { padding: 0; gap: 0; align-items: center; }
.pairchip .pname, .pairchip .star {
  font: inherit; background: none; border: 0; color: inherit; cursor: pointer; padding: 3px 4px;
}
.pairchip .pname { padding-left: 8px; }
.pairchip .star { padding-right: 7px; color: var(--ink-faint); font-size: 13px; line-height: 1; }
.pairchip .star.on { color: var(--leaf); }
.pairchip .star:hover { color: var(--leaf); }
.pairchip .pname:focus-visible, .pairchip .star:focus-visible { outline: 2px solid var(--leaf); outline-offset: -2px; }
.pairchip.on { background: var(--leaf-bg); color: var(--leaf); border-color: var(--leaf); }
.morechip { color: var(--ink-faint); }

.odds { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.odds th {
  text-align: left; font-family: var(--face-data); font-size: 10px; font-weight: 500;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint);
  padding: 0 8px 5px 0; border-bottom: 1px solid var(--rule);
}
.odds th.num, .odds td.num { text-align: right; font-variant-numeric: tabular-nums; }
.odds td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: baseline; }
.odds tr.dead td { color: var(--ink-faint); }
.odds td.num { font-family: var(--face-data); font-size: 12.5px; }
.odds .bar { display: block; height: 3px; background: var(--leaf); border-radius: 2px; margin-top: 3px; }
.odds tr.dead .bar { background: var(--ink-faint); }
.odds .via { font-size: 11.5px; color: var(--ink-faint); }
.tablescroll { overflow-x: auto; }

.branch {
  font-family: var(--face-data); font-size: 10.5px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-faint);
  padding: 14px 0 4px; border-bottom: 1px solid var(--ink); margin-bottom: 2px;
}

/* ---------------------------------------------------------- route */
.steps { display: flex; flex-direction: column; gap: 0; }
.step {
  display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--rule);
}
.step .idx {
  font-family: var(--face-data); font-size: 12px; font-variant-numeric: tabular-nums;
  color: var(--ink-faint); padding-top: 3px;
}
.step .body { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.step .made { font-family: var(--face-display); font-size: 16px; font-weight: 600; }

/* ---------------------------------------------------------- tips */
/* eleven sections is a long page, so it opens with what is on it */
.tipindex {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin: 0 0 22px; padding-bottom: 16px; border-bottom: 1px solid var(--rule);
}
.tipindex button {
  font: inherit; font-size: 12px; cursor: pointer; padding: 3px 9px;
  color: var(--ink); background: var(--paper-2);
  border: 1px solid var(--rule); border-radius: 2px;
}
.tipindex button:hover { background: var(--paper-3); border-color: var(--leaf); }
.tipindex button:focus-visible { outline: 2px solid var(--leaf); outline-offset: 1px; }

.tips { display: flex; flex-direction: column; gap: 26px; }
.tipgroup { scroll-margin-top: 14px; }
.tipgroup > h3 {
  font-family: var(--face-display); font-size: 19px;
  padding-bottom: 5px; border-bottom: 1px solid var(--ink); margin-bottom: 2px;
}
.tipgroup > p.lead { color: var(--ink-faint); font-size: 13px; margin: 7px 0 2px; }
.tiplist { list-style: none; margin: 0; padding: 0; }

.tip { border-bottom: 1px solid var(--rule); }
.tip-line {
  display: flex; align-items: baseline; gap: 12px;
  padding: 11px 0 10px;
}
.tip-line p { margin: 0; flex: 1; min-width: 0; }
.tip-line b { font-weight: 600; }

.why { position: relative; flex: none; }
.why-btn {
  font-family: var(--face-data); font-size: 9.5px; letter-spacing: .09em;
  text-transform: uppercase; cursor: help;
  color: var(--ore); background: var(--ore-bg);
  border: 1px solid color-mix(in srgb, var(--ore) 32%, transparent);
  border-radius: 2px; padding: 2px 6px;
}
.why-btn:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

.why-pop {
  display: none; position: absolute; z-index: 6;
  top: calc(100% + 6px); right: 0;
  width: max-content; max-width: min(440px, 72vw);
  padding: 9px 11px; text-align: left;
  font-family: var(--face-data); font-size: 11.5px; line-height: 1.55;
  color: var(--ink-soft); background: var(--paper-3);
  border: 1px solid var(--ink-faint); border-radius: 2px;
  box-shadow: 0 6px 20px var(--shadow);
}
.why-pop em { color: var(--ink); font-style: normal; font-weight: 600; }
.why:hover .why-pop, .why:focus-within .why-pop { display: block; }

/* ---------------------------------------------------------- the loop */
.flow-steps { list-style: none; margin: 4px 0 0; padding: 0; }
.flow-step { position: relative; display: flex; gap: 13px; align-items: flex-start; }
.flow-step + .flow-step { margin-top: 23px; }
/* the arrow lives in the gap above each step but the first, centred on the
   number column so the whole thing reads as one vertical chain            */
.flow-step + .flow-step::before {
  content: "\2193"; position: absolute; left: 7px; top: -20px;
  font-family: var(--face-data); font-size: 13px; line-height: 1;
  color: var(--ink-faint);
}
.flow-n {
  flex: none; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--face-data); font-size: 11px; font-variant-numeric: tabular-nums;
  color: var(--paper); background: var(--leaf);
}
.flow-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.flow-body p { margin: 0; }
.flow-head { display: flex; align-items: baseline; gap: 12px; }
.flow-head p { flex: 1; min-width: 0; }
.flow-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
.flow-pick select { min-width: 190px; font-size: 13px; padding: 5px 8px; }

/* a step you sit in and repeat, as opposed to one you pass through once */
.flow-cycle {
  padding: 9px 12px 10px; border: 1px dashed var(--rule);
  border-radius: 2px; background: var(--paper-2);
}
.flow-cycle-h {
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
  font-family: var(--face-data); font-size: 9.5px;
  letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint);
}
.flow-cycle-h span:first-child { flex: 1; min-width: 0; }
.flow-cycle ol {
  margin: 0; padding-left: 17px;
  display: flex; flex-direction: column; gap: 4px;
}
.flow-cycle li { padding-left: 3px; }

.goview {
  font: inherit; cursor: pointer; padding: 0;
  color: var(--leaf); background: none; border: 0;
  text-decoration: underline; text-underline-offset: 3px;
  text-decoration-color: color-mix(in srgb, var(--leaf) 45%, transparent);
}
.goview:hover { text-decoration-color: var(--leaf); }
.goview:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

/* ---------------------------------------------------------- drawer */
.drawer {
  position: fixed; inset: 0 0 0 auto; width: min(460px, 100%); z-index: 20;
  background: var(--paper); border-left: 1px solid var(--ink);
  box-shadow: -14px 0 40px var(--shadow);
  padding: 20px 22px 40px; overflow-y: auto;
  transform: translateX(100%); transition: transform .18s ease;
}
.drawer[data-open="true"] { transform: translateX(0); }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }

.drawer-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.drawer-top h2 { font-size: 22px; }
.drawer .close { margin-left: auto; }
.drawer .flav { font-size: 13px; color: var(--ink-faint); font-style: italic; margin-bottom: 14px; }

.dsec { margin-top: 18px; }
.dsec > h3 {
  font-family: var(--face-data); font-size: 10px; font-weight: 500; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-faint);
  padding-bottom: 4px; border-bottom: 1px solid var(--rule); margin-bottom: 8px;
}
.dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 13.5px; }
.dl dt { color: var(--ink-faint); }
.dl dd { margin: 0; }

.linkrow { display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }

/* pools a crop belongs to, and the contents of one pool */
.poolchips { display: flex; flex-wrap: wrap; gap: 5px; }
.poolchip {
  font: inherit; font-size: 12.5px; cursor: pointer;
  display: inline-flex; align-items: baseline; gap: 5px;
  padding: 3px 8px; color: var(--ink); background: var(--paper-2);
  border: 1px solid var(--rule); border-radius: 2px;
}
.poolchip:hover { background: var(--paper-3); border-color: var(--leaf); }
.poolchip:focus-visible { outline: 2px solid var(--leaf); outline-offset: 1px; }

.poollist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 10px; }
.poolrow { display: flex; align-items: baseline; gap: 5px; padding: 2px 0; min-width: 0; }
.poolrow .inline-crop { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.poolrow.have { opacity: .72; }
.inline-crop {
  font: inherit; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink);
  text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px;
}
.inline-crop:hover { text-decoration-color: var(--leaf); }
.inline-crop:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

/* pool names open their panel the same way crop names do, but they sit in
   muted table cells, so they take the cell's colour instead of forcing ink */
.inline-pool {
  font: inherit; background: none; border: 0; padding: 0; cursor: pointer;
  color: inherit; text-align: left;
  text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px;
}
.inline-pool:hover { color: var(--ink); text-decoration-color: var(--leaf); }
.inline-pool:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

.scrim {
  position: fixed; inset: 0; z-index: 19; background: rgba(20, 23, 15, .34);
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.scrim[data-open="true"] { opacity: 1; pointer-events: auto; }

.own-toggle { margin-top: 14px; }

/* ------------------------------------------------- manage-list panel */
/* Clear, Undo and the backup box all rewrite the whole tick list, so they
   live together behind one fold instead of cluttering the rail.          */
.railpanel { margin-top: 14px; }
.railpanel > summary {
  cursor: pointer; list-style: none;
  font-family: var(--face-data); font-size: 10px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-faint);
  padding: 5px 0; display: flex; align-items: center; gap: 6px;
}
.railpanel > summary::-webkit-details-marker { display: none; }
.railpanel > summary::before { content: "▸"; font-size: 9px; }
.railpanel[open] > summary::before { content: "▾"; }
.railpanel > summary:hover { color: var(--ink); }
.railpanel > summary:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

.railpanel-body { display: flex; flex-direction: column; gap: 7px; padding: 4px 0 2px; }
.railpanel-body p { margin: 0; font-size: 12px; color: var(--ink-faint); }
.railpanel-body hr {
  width: 100%; height: 0; margin: 3px 0;
  border: 0; border-top: 1px solid var(--rule);
}
#code {
  width: 100%; min-height: 86px; resize: vertical;
  font-family: var(--face-data); font-size: 11px; line-height: 1.45;
  color: var(--ink); background: var(--paper-2);
  border: 1px solid var(--rule); border-radius: 2px; padding: 6px 8px;
}
#code:focus-visible { outline: 2px solid var(--leaf); outline-offset: 1px; }
.railpanel-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.status { font-size: 12px; min-height: 1.4em; }
.status[data-kind="ok"] { color: var(--leaf); }
.status[data-kind="warn"] { color: var(--ore); }

.storagewarn {
  margin: 10px 0 0; padding: 8px 10px; font-size: 12px; line-height: 1.45;
  color: var(--ore); background: var(--ore-bg);
  border: 1px solid color-mix(in srgb, var(--ore) 32%, transparent); border-radius: 2px;
}

/* Two columns so the footer uses the page instead of hugging the left edge.
   Each column still keeps a readable measure of its own.                    */
footer.note {
  margin-top: 48px; padding-top: 14px; border-top: 1px solid var(--rule);
  font-size: 12px; line-height: 1.55; color: var(--ink-faint);
  display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: 14px 56px; align-items: start;
}
@media (max-width: 860px) { footer.note { grid-template-columns: minmax(0, 1fr); } }
.foot-main, .foot-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
footer.note p { margin: 0; }
footer.note code { font-family: var(--face-data); }
footer.note a {
  color: var(--ink-soft);
  text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px;
}
footer.note a:hover { color: var(--ink); text-decoration-color: var(--leaf); }
footer.note a:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

.foot-links { display: flex; flex-wrap: wrap; gap: 4px 18px; padding-top: 2px; }
.foot-links a {
  font-family: var(--face-data); font-size: 11px;
  letter-spacing: .07em; text-transform: uppercase;
}
</style>

<div class="wrap">
  <header class="masthead">
    <h1>{{head.h1}}</h1>
    <span class="sub">{{head.sub}}</span>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script>
const DATA = __DATA__;
const C = DATA.crops, MUT = DATA.mutations, POOLM = DATA.poolMembers;

const byName = Object.values(C).sort((a, b) => a.tier - b.tier || a.name.localeCompare(b.name));
const allSorted = Object.values(C).sort((a, b) => a.name.localeCompare(b.name));

const LS = "cropsnh-owned-v1";

/* localStorage can be blocked: private mode, or file:// in some browsers */
const storage = (() => {
  try {
    localStorage.setItem(LS + "-probe", "1");
    localStorage.removeItem(LS + "-probe");
    return localStorage;
  } catch (e) { return null; }
})();

let owned = new Set();
if (storage) {
  try { owned = new Set(JSON.parse(storage.getItem(LS) || "[]").filter(id => C[id])); } catch (e) {}
}

/* Recipes you are working on right now. Marked cards are highlighted and
   sorted to the front, so the one you are building is never something you
   have to hunt for on a second monitor. Kept per recipe, not per crop,
   because one crop can have several recipes.                             */
const LS_MARK = "cropsnh-marked-v1";
const markKey = m => `${m.out}|${m.parents.join(",")}`;
let marked = new Set();
if (storage) {
  try { marked = new Set(JSON.parse(storage.getItem(LS_MARK) || "[]")); } catch (e) {}
}
function toggleMark(key) {
  marked.has(key) ? marked.delete(key) : marked.add(key);
  if (storage) { try { storage.setItem(LS_MARK, JSON.stringify([...marked])); } catch (e) {} }
  render();
}
/* marked first, otherwise the order the view already decided */
const markFirst = list => [...list].sort((a, b) => marked.has(markKey(b)) - marked.has(markKey(a)));

let view = "ready";
let filter = "";
let pairA = "", pairB = "";
let target = "";

/* Pairs you have already looked at, newest first. Working through a plot
   means flicking between the same handful of pairs, and rebuilding each one
   from two dropdowns every time is the slow part. Stored with the two ids
   sorted, because oddsFor(a, b) is symmetric - A+B and B+A are one entry. */
const LS_PAIRS = "cropsnh-pairs-v1";
const PAIRS_KEEP = 10, PAIRS_SHOWN = 5;
const pairKey = (a, b) => a < b ? `${a}|${b}` : `${b}|${a}`;
let recentPairs = [];
if (storage) {
  try {
    recentPairs = JSON.parse(storage.getItem(LS_PAIRS) || "[]")
      .filter(k => { const [a, b] = String(k).split("|"); return C[a] && C[b]; })
      .slice(0, PAIRS_KEEP);
  } catch (e) {}
}
let pairsOpen = false;                    // the rest of the list, this session only

/* Pairs worth keeping. Recent drops the oldest entry as you work, which is
   wrong for the two or three pairs a plot is actually built around, so those
   get pinned by hand and stay until you unpin them. New ones go on the end:
   a kept list that reorders itself is a list you have to read every time. */
const LS_SAVED = "cropsnh-saved-v1";
let savedPairs = [];
if (storage) {
  try {
    savedPairs = JSON.parse(storage.getItem(LS_SAVED) || "[]")
      .filter(k => { const [a, b] = String(k).split("|"); return C[a] && C[b]; });
  } catch (e) {}
}

function recordPair(a, b) {
  if (!a || !b) return;
  const k = pairKey(a, b);
  if (recentPairs[0] === k) return;       // already at the front, nothing moves
  recentPairs = [k, ...recentPairs.filter(x => x !== k)].slice(0, PAIRS_KEEP);
  if (storage) { try { storage.setItem(LS_PAIRS, JSON.stringify(recentPairs)); } catch (e) {} }
}

function toggleSave(k) {
  savedPairs = savedPairs.includes(k) ? savedPairs.filter(x => x !== k) : [...savedPairs, k];
  if (storage) { try { storage.setItem(LS_SAVED, JSON.stringify(savedPairs)); } catch (e) {} }
  render();
}

/* every way of choosing parents goes through here, so none of them skips history */
function setPair(a, b) { pairA = a; pairB = b; recordPair(a, b); }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nm = id => C[id] ? C[id].name : id;
const pct = p => (p * 100).toFixed(2) + "%";

/* Every crop name anywhere on the page opens its detail panel. */
const cropLink = (id, cls) =>
  `<button class="inline-crop${cls ? " " + cls : ""}" type="button" data-crop="${id}">${esc(nm(id))}</button>`;

/* parents of a recipe, marking which ones you are missing */
const parentLinks = ids => ids
  .map(p => cropLink(p, owned.has(p) ? "own" : "miss"))
  .join(`<span class="plus">+</span>`);

/* Every pool name anywhere on the page opens its panel. Takes the pool key,
   never the display name - the two differ and only the key can be looked up. */
const poolLink = key => POOLM[key]
  ? `<button class="inline-pool" type="button" data-pool="${key}">${esc(DATA.poolNames[key] || key)}</button>`
  : esc(key);

function save() {
  if (storage) { try { storage.setItem(LS, JSON.stringify([...owned])); } catch (e) {} }
  syncCode();
}

/* One step of undo, for the actions that rewrite the whole list at once.
   Undo is itself undoable - it swaps the current list with the stored one.  */
let undoState = null;
function snapshot() { undoState = [...owned]; }

/* ---------------------------------------------------------- backup */
function currentCode() {
  return JSON.stringify({
    tool: "cropsnh-planner", v: 1,
    saved: new Date().toISOString().slice(0, 10),
    seeds: [...owned].sort()
  }, null, 1);
}
function syncCode() {
  const box = $("code");
  if (box && document.activeElement !== box) box.value = currentCode();
}
function status(msg, kind) {
  const s = $("status");
  s.textContent = msg;
  s.dataset.kind = kind || "";
}

function applyImport(text) {
  let ids;
  try {
    const p = JSON.parse(text);
    // `nasiona` is the key older exports used, kept so those still load
    ids = Array.isArray(p) ? p : (p.seeds || p.owned || p.nasiona);
  } catch (e) {
    ids = text.split(/[\s,;]+/);            // a plain list of names works too
  }
  if (!Array.isArray(ids)) { status(`{{msg.badFormat}}`, "warn"); return; }
  const known = ids.map(String).map(s => s.trim()).filter(id => C[id]);
  const unknown = ids.length - known.length;
  if (!known.length) { status(`{{msg.noneKnown}}`, "warn"); return; }
  snapshot();
  owned = new Set(known);
  save(); render();
  status(`{{msg.loaded}}` + (unknown > 0 ? `{{msg.loadedSkipped}}` : "") + `{{msg.loadedUndo}}`, "ok");
}

/* ---------------------------------------------------------- requirements */
/* Three blocks matter, always in this order:
   the crop stick, the TOP BLOCK right under it, the UNDER BLOCK one deeper. */
/* Several soil lists are just unions of other lists, so a crop's top block is
   usually a choice of several blocks rather than one.                        */
function topParts(crop) {
  const out = [];
  for (const s of crop.soil)
    for (const p of (DATA.soilExpand[s] || [s]))
      if (!out.includes(p)) out.push(p);
  return out;
}
function topBlock(crop) {
  const p = topParts(crop);
  return p.map(s => DATA.soilGloss[s] || s).join(`{{word.orJoin}}`);
}
function topBlockShort(crop) {
  const p = topParts(crop);
  return p.map(s => DATA.soilShort[s] || s).join(" / ");
}
function underBlock(crop) {
  return crop.subsoil.length ? crop.subsoil.map(subLabel).join(" / ") : "";
}
function lightReq(crop) {
  if (crop.maxLight !== null) return `{{light.max}}`;
  if (crop.minLight !== null && crop.minLight > 9) return `{{light.min}}`;
  return "";
}

/* `extra` appends a chip built by the caller - used for the Crop Breeder
   marker, which belongs on the same row as the rest of the requirements. */
function reqChips(crop, extra) {
  if (!crop) return "";
  const out = [`<span class="chip soil"><span class="k">{{chip.top}}</span>${esc(topBlockShort(crop))}</span>`];
  const u = underBlock(crop);
  out.push(u
    ? `<span class="chip sub"><span class="k">{{chip.under}}</span>${esc(u)}</span>`
    : `<span class="chip none"><span class="k">{{chip.under}}</span>{{word.anything}}</span>`);
  const l = lightReq(crop);
  if (l) out.push(`<span class="chip light"><span class="k">{{chip.light}}</span>${esc(l)}</span>`);
  if (extra) out.push(extra);
  return `<div class="chips">${out.join("")}</div>`;
}

const machChip = m => m.machineOnly
  ? `<span class="chip mach" title="{{chip.onlyTitle}}"><span class="k">{{chip.only}}</span>{{word.breeder}}</span>` : "";

/* Same facts as reqChips, same labels, without the boxes - see .pneed. */
function reqPlain(crop) {
  if (!crop) return "";
  const g = (k, v, ore) =>
    `<span class="g"><span class="k">${k}</span><span${ore ? ` class="ore"` : ""}>${esc(v)}</span></span>`;
  const u = underBlock(crop), l = lightReq(crop);
  return `<div class="pneed">${g(`{{pneed.top}}`, topBlockShort(crop))}${g(`{{pneed.under}}`, u || `{{word.anything}}`, !!u)}${
    l ? g(`{{pneed.light}}`, l, true) : ""}</div>`;
}

/* result, its ground, then each parent with its own ground */
function parentRows(m) {
  return `<div class="pgroup"><span class="lbl">{{card.from}}</span>${m.parents.map(p => `
    <div class="prow">${cropLink(p, owned.has(p) ? "own" : "miss")}
      ${reqPlain(C[p])}</div>`).join("")}</div>`;
}

function subLabel(key) {
  const d = DATA.subsoilDesc[key];
  if (!d) return key;
  const t = d.replace(/^Needs an? /i, "").replace(/ (under it )?to grow$/i, "").replace(/ under it$/i, "");
  return t.charAt(0).toUpperCase() + t.slice(1);
}

/* ---------------------------------------------------------- logic */
const missingOf = m => m.parents.filter(p => !owned.has(p));

function readyList() {
  return MUT.filter(m => !owned.has(m.out) && missingOf(m).length === 0)
            .sort((a, b) => (C[a.out]?.tier ?? 99) - (C[b.out]?.tier ?? 99) || nm(a.out).localeCompare(nm(b.out)));
}
function nearList() {
  return MUT.filter(m => !owned.has(m.out) && missingOf(m).length === 1)
            .sort((a, b) => (C[a.out]?.tier ?? 99) - (C[b.out]?.tier ?? 99) || nm(a.out).localeCompare(nm(b.out)));
}

/* forward BFS: everything the current set can eventually produce */
function reachable() {
  const have = new Set(owned), via = new Map();
  let grew = true;
  while (grew) {
    grew = false;
    for (const m of MUT) {
      if (have.has(m.out)) continue;
      if (m.parents.every(p => have.has(p))) { have.add(m.out); via.set(m.out, m); grew = true; }
    }
  }
  return { have, via };
}

function planFor(goal) {
  const { have, via } = reachable();
  if (!have.has(goal)) return null;
  const steps = [], done = new Set(owned);
  (function walk(id) {
    if (done.has(id)) return;
    const m = via.get(id);
    if (!m) return;
    m.parents.forEach(walk);
    if (!done.has(id)) { done.add(id); steps.push(m); }
  })(goal);
  return steps;
}

/* Odds for a pair of parents.
   a === b is allowed and matters: createLookupQueue() calls .distinct(), so two
   identical crops fire no recipe at all, while createPoolQueue() does not
   deduplicate - so pools still apply, and every pool of that crop matches.   */
function oddsFor(a, b) {
  if (!a || !b) return null;
  const same = a === b;
  const det = same ? [] : MUT.filter(m =>
    m.parents.length === 2 && m.parents.includes(a) && m.parents.includes(b));
  const pools = Object.keys(POOLM).filter(p =>
    same ? POOLM[p].includes(a) : (POOLM[p].includes(a) && POOLM[p].includes(b)));

  const rows = new Map();
  const add = (id, p, via, isDet) => {
    const r = rows.get(id) || { id, p: 0, via: new Set(), det: false };
    r.p += p; r.det = r.det || !!isDet; if (via) r.via.add(via); rows.set(id, r);
  };

  if (det.length) {
    // the engine picks ONE candidate at random among matching recipes
    for (const m of det) add(m.out, 0.5 / det.length, "recipe", true);
  } else {
    for (const p of pools) {
      const mem = POOLM[p];
      // the pool KEY, so the table can link it; the display name is resolved on render
      for (const id of mem) add(id, 0.5 * (1 / pools.length) * (1 / mem.length), p);
    }
  }
  /* crops you already have sink to the bottom; within each block, best odds first */
  const held = r => owned.has(r.id) ? 1 : 0;
  const list = [...rows.values()].sort((x, y) => held(x) - held(y) || y.p - x.p);
  const gain = list.filter(r => !owned.has(r.id)).reduce((s, r) => s + r.p, 0);
  return { same, det, pools, rows: list, gain, newCount: list.filter(r => !owned.has(r.id)).length };
}

/* Rank pairs from the owned set by the chance of anything new.
   Pairs of the same crop twice are included - that is the most common setup. */
function bestPairs(limit) {
  const ids = [...owned];
  const out = [];
  for (let i = 0; i < ids.length; i++) {
    for (let j = i; j < ids.length; j++) {
      const o = oddsFor(ids[i], ids[j]);
      if (o && o.gain > 0) out.push({ a: ids[i], b: ids[j], gain: o.gain, n: o.newCount, det: o.det.length > 0 });
    }
  }
  return out.sort((x, y) => y.gain - x.gain || y.n - x.n).slice(0, limit);
}

/* ---------------------------------------------------------- rail */
/* byName is sorted by tier then name and the groups render in tier order, so
   entry 0 here is the first row on screen - which is what Enter ticks.     */
function railList() {
  const q = filter.trim().toLowerCase();
  return byName.filter(c => !q || c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q));
}

function renderRail() {
  const list = railList();
  const groups = new Map();
  for (const c of list) (groups.get(c.tier) || groups.set(c.tier, []).get(c.tier)).push(c);

  let html = "";
  for (const [tier, cs] of [...groups.entries()].sort((x, y) => x[0] - y[0])) {
    html += `<div class="tiergroup"><div class="tierhead">{{rail.tier}}</div>`;
    for (const c of cs) {
      const mark = c.subsoil.length ? "◆" : "";
      html += `<div class="seed">
        <button class="seed-tick" type="button" role="checkbox" data-id="${c.id}" aria-pressed="${owned.has(c.id)}">
          <span class="box"></span><span class="nm">${esc(c.name)}</span>
        </button>
        <span class="mark" title="{{rail.markTitle}}">${mark}</span>
        <button class="seed-info" type="button" data-crop="${c.id}"
          title="{{rail.details}}" aria-label="{{rail.details}}">i</button>
      </div>`;
    }
    html += `</div>`;
  }
  $("seedlist").innerHTML = html || `<div class="empty">{{empty.noMatches}}</div>`;
  const share = owned.size / byName.length * 100;
  $("tally").innerHTML = `${owned.size} / ${byName.length} <b>${Math.round(share)}%</b>`;
  $("progress").setAttribute("aria-valuenow", Math.round(share));
  /* a sliver still has to be visible, or one crop looks the same as none */
  $("progressFill").style.width = owned.size ? `max(2px, ${share.toFixed(1)}%)` : "0";
  $("undo").hidden = undoState === null;
}

}

/* One pill: the name picks the pair, the star keeps it. The name carries the
   same data-pair the best-pairs table does, so one handler serves both. */
function pairPill(k, cur) {
  const [a, b] = k.split("|");
  const kept = savedPairs.includes(k);
  return `<span class="poolchip pairchip${k === cur ? " on" : ""}">
    <button class="pname" type="button" data-pair="${k}"${k === cur ? ` aria-current="true"` : ""}>${
      esc(nm(a))}${a === b ? " ×2" : ` + ${esc(nm(b))}`}</button>
    <button class="star${kept ? " on" : ""}" type="button" data-star="${k}" aria-pressed="${kept}"
      title="${kept ? `{{pair.unsave}}` : `{{pair.save}}`}">${kept ? "★" : "☆"}</button>
  </span>`;
}

/* Five most recent pairs with the other five behind a toggle, then the kept
   ones underneath. Either row is left out entirely when it has nothing. */
function pairStrips() {
  const cur = pairA && pairB ? pairKey(pairA, pairB) : "";
  let h = "";
  if (recentPairs.length) {
    const shown = pairsOpen ? recentPairs : recentPairs.slice(0, PAIRS_SHOWN);
    const hidden = recentPairs.length - PAIRS_SHOWN;
    h += `<div class="pairrow recent"><span class="lbl">{{pair.recent}}</span>${
      shown.map(k => pairPill(k, cur)).join("")}${
      hidden > 0 ? `<button class="poolchip morechip" type="button" id="morePairs">${
        pairsOpen ? `{{pair.fewer}}` : `{{pair.more}}`}</button>` : ""}</div>`;
  }
  if (savedPairs.length)
    h += `<div class="pairrow saved"><span class="lbl">{{pair.saved}}</span>${
      savedPairs.map(k => pairPill(k, cur)).join("")}</div>`;
  return h;
}

function renderPool() {
  const opts = sel => allSorted.map(c =>
    `<option value="${c.id}"${sel === c.id ? " selected" : ""}>${esc(c.name)}${owned.has(c.id) ? " ✓" : ""}</option>`).join("");
  let html = `<p class="viewnote">{{pool.note}}</p>
    <div class="pairpick">
      <label>{{pool.parentA}}<select class="field" id="selA"><option value="">-</option>${opts(pairA)}</select></label>
      <label>{{pool.parentB}}<select class="field" id="selB"><option value="">-</option>${opts(pairB)}</select></label>
      ${pairA || pairB ? `<button class="btn" id="clearPair" type="button">{{pool.clear}}</button>` : ""}
    </div>${pairStrips()}`;

  const o = oddsFor(pairA, pairB);
  if (!o) return html + renderBestPairs();

  const A = C[pairA], B = C[pairB];

  html += o.newCount
    ? `<p class="viewnote">{{pool.gain}}</p>`
    : `<p class="viewnote">{{pool.noGain}}</p>`;

  /* --- cloning branch --- */
  html += `<div class="branch">{{pool.branchClone}}</div><div class="tablescroll"><table class="odds">`;
  if (o.same) {
    html += `<tr><td class="nm">${cropLink(pairA)}</td><td class="num">50.00%<span class="bar" style="width:100%"></span></td>
      <td class="via">{{pool.cloneSame}}</td></tr>`;
  } else {
    html += `<tr><td class="nm">${cropLink(pairA)}</td><td class="num">25.00%<span class="bar" style="width:50%"></span></td><td class="via">{{pool.cloneOne}}</td></tr>
      <tr><td class="nm">${cropLink(pairB)}</td><td class="num">25.00%<span class="bar" style="width:50%"></span></td><td class="via">{{pool.cloneOne}}</td></tr>`;
  }
  html += `</table></div>`;

  /* --- mutation branch --- */
  if (o.det.length) {
    html += `<div class="branch">{{pool.branchRecipe}}</div>
      <p class="viewnote">{{pool.recipeNote}}
      ${o.det.length > 1 ? `{{pool.recipeTie}} ` : ""}{{pool.recipeFallback}}</p>
      <div class="grid">${o.det.map(m => cardFor(m)).join("")}</div>`;
    return html;
  }

  if (!o.pools.length) {
    html += `<div class="branch">{{pool.branchMutation}}</div>
      <div class="empty">${o.same
        ? `{{pool.noPoolSame}}`
        : `{{pool.noPoolShared}}`}<br>{{pool.noPoolTail}}</div>`;
    return html;
  }

  const poolTxt = o.pools.map(p => `${poolLink(p)} (${POOLM[p].length})`).join(", ");
  const showLight = o.rows.some(r => lightReq(C[r.id]));   // column only when it applies
  html += `<div class="branch">{{pool.branchDraw}}</div>
    <p class="viewnote">${o.same
      ? `{{pool.sharedSame}}`
      : `{{pool.shared}}`} {{pool.drawNote}}</p>
    <p class="viewnote">{{pool.blockNote}}</p>
    <div class="tablescroll"><table class="odds">
      <tr><th>{{th.result}}</th><th class="num">{{th.chance}}</th><th>{{th.pool}}</th><th>{{th.topBlock}}</th><th>{{th.underBlock}}</th>${showLight ? `<th>{{th.light}}</th>` : ""}</tr>`;
  const max = Math.max(...o.rows.map(r => r.p));   // rows are no longer ordered by odds
  for (const r of o.rows) {
    const c = C[r.id];
    const have = owned.has(r.id);
    const u = underBlock(c);
    html += `<tr${have ? ` class="dead"` : ""}>
      <td class="nm"><button class="inline-crop" type="button" data-crop="${r.id}">${esc(c.name)}</button>${have ? ` <span class="tier">{{word.have}}</span>` : ""}</td>
      <td class="num">${pct(r.p)}<span class="bar" style="width:${(r.p / max * 100).toFixed(1)}%"></span></td>
      <td class="via">${[...r.via].map(poolLink).join(", ")}</td>
      <td class="via">${esc(topBlockShort(c))}</td>
      <td class="via"${u ? ` style="color:var(--ore)"` : ""}>${u ? esc(u) : `{{word.anything}}`}</td>
      ${showLight ? `<td class="via"${lightReq(c) ? ` style="color:var(--ore)"` : ""}>${esc(lightReq(c) || `{{word.any}}`)}</td>` : ""}
    </tr>`;
  }
  html += `</table></div>`;
  return html;
}

/* shown when no pair is picked */
function renderBestPairs() {
  if (owned.size < 1) return `<div class="empty">{{best.pickFirst}}</div>`;
  const best = bestPairs(15);
  if (!best.length) return `<div class="empty">{{best.none}}</div>`;
  let html = `<div class="branch">{{best.title}}</div>
    <p class="viewnote">{{best.note}}</p>
    <div class="tablescroll"><table class="odds">
    <tr><th>{{th.pair}}</th><th class="num">{{th.chanceNew}}</th><th class="num">{{th.new}}</th><th>{{th.branch}}</th></tr>`;
  const max = best[0].gain;
  for (const p of best) {
    html += `<tr>
      <td class="nm"><button class="inline-crop" type="button" data-pair="${p.a}|${p.b}">${esc(nm(p.a))}${p.a === p.b ? " ×2" : ` + ${esc(nm(p.b))}`}</button></td>
      <td class="num">${pct(p.gain)}<span class="bar" style="width:${(p.gain / max * 100).toFixed(1)}%"></span></td>
      <td class="num">${p.n}</td>
      <td class="via">${p.det ? "recipe" : "pools"}</td>
    </tr>`;
  }
  return html + `</table></div>`;
}

function renderFlow() {
  const opts = allSorted.map(c =>
    `<option value="${c.id}">${esc(c.name)}${owned.has(c.id) ? " ✓" : ""}</option>`).join("");
  let html = `<section class="tipgroup" id="sec-flow">
    <h3>{{flow.title}}</h3>
    <p class="lead">{{flow.lead}}</p>
    <ol class="flow-steps">`;
  FLOW.forEach((s, i) => {
    html += `<li class="flow-step"><span class="flow-n">${i + 1}</span><div class="flow-body">
      <div class="flow-head"><p><b>${s.t}</b></p>${s.w ? `<span class="why"><button class="why-btn" type="button">{{word.why}}</button>
        <span class="why-pop" role="note">${s.w}</span></span>` : ""}</div>
      <p>${s.d}</p>`;
    if (s.cycle) html += `<div class="flow-cycle">
      <div class="flow-cycle-h"><span>&#8635; ${s.cycle.h}</span>${s.cycle.w ? `<span class="why"><button class="why-btn" type="button">{{word.why}}</button>
        <span class="why-pop" role="note">${s.cycle.w}</span></span>` : ""}</div>
      <ol>${s.cycle.items.map(i => `<li>${i}</li>`).join("")}</ol></div>`;

  });
  return html + `</ol></section>`;
}

/* A tip with no why box is one that has no source in the mod - the ones about
   this page itself. Everything else has to name where it comes from.       */
function tipGroup(g, id) {
  let html = `<section class="tipgroup" id="${id}"><h3>${g.h}</h3>`;
  if (g.lead) html += `<p class="lead">${g.lead}</p>`;
  html += `<ul class="tiplist">`;
  for (const [text, why] of g.items) {
    html += `<li class="tip"><div class="tip-line">
      <p>${text}</p>
      ${why ? `<span class="why"><button class="why-btn" type="button">{{word.why}}</button>
        <span class="why-pop" role="note">${why}</span></span>` : ""}
    </div></li>`;
  }
  return html + `</ul></section>`;
}

/* Eleven sections is a long scroll, so it opens with a list of what is here.
   These jump by script rather than by href: an anchor would put its own
   fragment in the url, and the url already carries the view state.        */
function renderTips() {
  const secs = [{ id: "sec-flow", h: `{{flow.title}}` }]
    .concat(TIPS.map((g, i) => ({ id: `sec-${i}`, h: g.h })));
  const index = `<nav class="tipindex" aria-label="{{tips.indexLabel}}">${
    secs.map(s => `<button type="button" data-jump="${s.id}">${s.h}</button>`).join("")}</nav>`;

  let html = `<p class="viewnote">{{tips.note}}</p>${index}<div class="tips">` + renderFlow();
  TIPS.forEach((g, i) => { html += tipGroup(g, `sec-${i}`); });
  return html + `</div>`;
}

function renderPath() {
  if (!owned.size) {
    return `<p class="viewnote">{{path.intro}}</p>
      <div class="empty">{{path.tickFirst}}<br>{{path.tickWhy}}</div>`;
  }

  const { have } = reachable();
  const reachableOpts = [], blockedOpts = [];
  for (const c of allSorted) {
    if (owned.has(c.id)) continue;
    const opt = `<option value="${c.id}"${target === c.id ? " selected" : ""}>${esc(c.name)} (T${c.tier})</option>`;
    (have.has(c.id) ? reachableOpts : blockedOpts).push(opt);
  }

  let html = `<p class="viewnote">{{path.note}}</p>
    <div class="pairpick"><label>{{path.goal}}<select class="field" id="selTarget" style="min-width:280px">
      <option value="">-</option>
      ${reachableOpts.length ? `<optgroup label="{{path.groupReachable}}">${reachableOpts.join("")}</optgroup>` : ""}
      ${blockedOpts.length ? `<optgroup label="{{path.groupBlocked}}">${blockedOpts.join("")}</optgroup>` : ""}
    </select></label></div>`;

  if (!target) {
    return html + (reachableOpts.length
      ? `<div class="empty">{{path.pickGoal}}</div>`
      : `<div class="empty">{{path.noneReachable}}</div>`);
  }
  if (owned.has(target)) return html + `<div class="empty">{{path.alreadyHave}}</div>`;

  const steps = planFor(target);
  if (!steps) {
    const recipes = MUT.filter(x => x.out === target);
    if (!recipes.length) {
      return html + `<div class="empty">{{path.noRecipe}}</div>`;
    }
    // one level of "what exactly is in the way", with each blocker's own status
    const made = recipes.length === 1 ? `{{path.madeOne}}` : `{{path.madeMany}}`;
    html += `<p class="viewnote">{{path.blockedBy}}</p><div class="steps">`;
    for (const m of recipes) {
      const missing = m.parents.filter(p => !owned.has(p));
      html += `<div class="step"><div class="idx">-</div><div class="body">
        <div class="parents">${parentLinks(m.parents)}</div>
        <div class="linkrow">${missing.map(p => {
          const inPools = (C[p].pools || []).length;
          const state = have.has(p)
            ? `{{path.stateReachable}}`
            : (MUT.some(x => x.out === p)
                ? (inPools ? `{{path.stateInPools}}` : `{{path.stateNoPool}}`)
                : `{{path.stateWild}}`);
          return `<span style="font-size:12.5px;color:var(--ink-faint)">
            <button class="inline-crop" type="button" data-crop="${p}">${esc(nm(p))}</button> - ${state}</span>`;
        }).join("")}</div>
      </div></div>`;
    }
    return html + `</div>`;
  }

  html += `<div class="steps">`;
  steps.forEach((m, i) => {
    const c = C[m.out];
    html += `<div class="step">
      <div class="idx">${String(i + 1).padStart(2, "0")}</div>
      <div class="body">
        <div class="made"><button class="inline-crop" type="button" data-crop="${m.out}">${esc(nm(m.out))}</button>
          <span class="tier">T${c ? c.tier : "?"}</span></div>
        ${reqChips(c, machChip(m))}
        ${parentRows(m)}
      </div></div>`;
  });
  html += `</div>`;
  return html;
}

/* ---------------------------------------------------------- drawer */
/* The drawer shows either a crop or a pool, and you can walk between them,
   so it keeps a small history to give a working back step.                  */
let drawerStack = [];

function showCrop(id) { if (C[id]) { drawerStack.push({ t: "crop", id }); paintDrawer(); } }
function showPool(key) { if (POOLM[key]) { drawerStack.push({ t: "pool", id: key }); paintDrawer(); } }
function drawerBack() {
  drawerStack.pop();
  drawerStack.length ? paintDrawer() : closeDrawer();
}
function paintDrawer() {
  const top = drawerStack[drawerStack.length - 1];
  if (!top) return closeDrawer();
  top.t === "pool" ? renderPoolDrawer(top.id) : renderCropDrawer(top.id);
  $("drawer").dataset.open = "true";
  $("drawer").setAttribute("aria-hidden", "false");
  $("scrim").dataset.open = "true";
  $("closeDrawer").onclick = closeDrawer;
  const back = $("drawerBack");
  if (back) back.onclick = drawerBack;
  writeHash();
}

function backButton() {
  if (drawerStack.length < 2) return "";
  const prev = drawerStack[drawerStack.length - 2];
  const label = prev.t === "pool" ? (DATA.poolNames[prev.id] || prev.id) : nm(prev.id);
  return `<button class="btn" type="button" id="drawerBack">&larr; ${esc(label)}</button>`;
}

/* pool view: what is in it, split by what you already hold */
function renderPoolDrawer(key) {
  const members = POOLM[key] || [];
  const mine = members.filter(id => owned.has(id));
  const rest = members.filter(id => !owned.has(id));
  const byName = ids => ids.slice().sort((a, b) => nm(a).localeCompare(nm(b)));
  const row = id => {
    const c = C[id];
    return `<div class="poolrow${owned.has(id) ? " have" : ""}">
      ${cropLink(id, owned.has(id) ? "own" : "miss")}
      <span class="tier">T${c.tier}</span>
      ${c.subsoil.length ? `<span class="mark" title="{{rail.legendSub}}">&#9670;</span>` : ""}
    </div>`;
  };

  $("drawer").innerHTML = `
    <div class="drawer-top">
      <h2>${esc(DATA.poolNames[key] || key)}</h2>
      ${backButton()}
      <button class="btn close" type="button" id="closeDrawer">{{drawer.close}}</button>
    </div>
    <p class="flav" style="font-style:normal">{{drawer.poolIntro}}</p>

    <div class="dsec"><h3>{{drawer.poolRest}}</h3>
      <div class="poollist">${rest.length ? byName(rest).map(row).join("")
        : `<span style="color:var(--ink-faint);font-size:13px">{{drawer.poolAllOwned}}</span>`}</div>
    </div>

    <div class="dsec"><h3>{{drawer.poolMine}}</h3>
      <div class="poollist">${mine.length ? byName(mine).map(row).join("")
        : `<span style="color:var(--ink-faint);font-size:13px">{{drawer.poolNoneMine}}</span>`}</div>
    </div>`;
}

function renderCropDrawer(id) {
  const c = C[id]; if (!c) return;
  const from = MUT.filter(m => m.out === id);
  const used = MUT.filter(m => m.parents.includes(id));
  const sub = c.subsoil.map(k => {
    const info = DATA.subsoil[k] || {};
    const acc = [...(info.oredict || []), ...(info.modBlocks || [])];
    return `<dt>{{th.underBlock}}</dt><dd>${esc(DATA.subsoilDesc[k] || k)}` +
      (acc.length ? `<br><span style="font-family:var(--face-data);font-size:12px;color:var(--ink-faint)">${esc(acc.join(", "))}</span>` : "") +
      `</dd>`;
  }).join("");

  $("drawer").innerHTML = `
    <div class="drawer-top">
      <h2>${esc(c.name)}</h2>
      ${backButton()}
      <button class="btn close" type="button" id="closeDrawer">{{drawer.close}}</button>
    </div>
    ${c.flavour ? `<p class="flav">${esc(c.flavour)}</p>` : ""}

    <div class="dsec"><h3>{{drawer.conditions}}</h3>
      <p class="flav" style="font-style:normal;margin-bottom:8px">{{drawer.stack}}</p>
      <dl class="dl">
        <dt>{{drawer.tier}}</dt><dd>${c.tier}</dd>
        <dt>{{th.topBlock}}</dt><dd>${topParts(c).length > 1
          ? `{{drawer.anyOneOf}}<br>` + topParts(c).map(s => `· ${esc(DATA.soilGloss[s] || s)}`).join("<br>")
          : esc(topBlock(c))}</dd>
        ${c.subsoil.length ? sub : `<dt>{{th.underBlock}}</dt><dd>{{drawer.underNone}}</dd>`}
        ${c.maxLight !== null ? `<dt>{{th.light}}</dt><dd>{{drawer.lightMax}}</dd>` : ""}
        ${c.minLight !== null ? `<dt>{{th.light}}</dt><dd>{{drawer.lightMin}}</dd>` : ""}
        <dt>{{drawer.growth}}</dt><dd>${c.growth ?? "-"}</dd>
        ${c.biomes && c.biomes.length ? `<dt>{{drawer.likes}}</dt><dd>${
          esc(c.biomes.map(b => DATA.biomeNames[b] || b).join(", "))}<br>
          <span style="font-size:12px;color:var(--ink-faint)">{{drawer.likesNote}}</span></dd>` : ""}
      </dl>
      <button class="btn own-toggle" type="button" id="toggleOwn">${owned.has(id) ? `{{drawer.untick}}` : `{{drawer.tick}}`}</button>
    </div>

    <div class="dsec"><h3>{{drawer.pools}}</h3>
      ${c.pools.length ? `<p class="flav" style="font-style:normal;margin-bottom:8px">{{drawer.poolsNote}}</p>` : ""}
      <div class="poolchips">${c.pools.length
        ? c.pools.map(p => `<button class="poolchip" type="button" data-pool="${p}">${esc(DATA.poolNames[p] || p)}
            <span class="tier">${POOLM[p] ? POOLM[p].length : 0}</span></button>`).join("")
        : `<span style="color:var(--ink-faint);font-size:13px">{{drawer.noPools}}</span>`}</div>
    </div>

    <div class="dsec"><h3>{{drawer.howToGet}}</h3>
      <div class="linkrow">${from.length
        ? from.map(m => `<span class="parents">${parentLinks(m.parents)}${m.machineOnly ? ` <span class="tier">{{word.breeder}}</span>` : ""}</span>`).join("")
        : `<span style="color:var(--ink-faint)">{{drawer.noRecipe}}${c.pools.length
            ? ` {{drawer.noRecipePools}}`
            : ` {{drawer.noRecipeWild}}`}</span>`}</div>
    </div>

    <div class="dsec"><h3>{{drawer.usedAs}}</h3>
      <div class="linkrow">${used.length
        ? used.map(m => `<span>${cropLink(m.out, owned.has(m.out) ? "own" : "miss")}
            <span class="parents" style="font-size:12px"> ← ${parentLinks(m.parents)}</span></span>`).join("")
        : `<span style="color:var(--ink-faint)">{{drawer.nowhere}}</span>`}</div>
    </div>`;

  $("toggleOwn").onclick = () => { toggle(id); paintDrawer(); };
}
function closeDrawer() {
  drawerStack = [];
  $("drawer").dataset.open = "false";
  $("drawer").setAttribute("aria-hidden", "true");
  $("scrim").dataset.open = "false";
  writeHash();
}

/* ---------------------------------------------------------- render */
function render() {
  renderRail();
  for (const t of document.querySelectorAll(".tab"))
    t.setAttribute("aria-selected", t.dataset.view === view);
  $("n-ready").textContent = owned.size ? readyList().length : "";
  $("n-near").textContent = owned.size ? nearList().length : "";
  $("view").innerHTML =
    view === "ready" ? renderReady() :
    view === "near" ? renderNear() :
    view === "pool" ? renderPool() :
    view === "tips" ? renderTips() :
    view === "about" ? renderAbout() : renderPath();

  const sa = $("selA"), sb = $("selB"), st = $("selTarget"), fp = $("flowPick");
  if (sa) sa.onchange = e => { setPair(e.target.value, pairB); render(); };
  if (sb) sb.onchange = e => { setPair(pairA, e.target.value); render(); };
  if (st) st.onchange = e => { target = e.target.value; render(); };
  /* the loop step is about two of the SAME crop, so it fills both parents */
  if (fp) fp.onchange = e => {
    if (!e.target.value) return;
    setPair(e.target.value, e.target.value);
    view = "pool";
    render();
  };
  writeHash();
}

function toggle(id) {
  owned.has(id) ? owned.delete(id) : owned.add(id);
  save(); render();
}

/* ---------------------------------------------------------- url state */
/* The hash carries the whole view, so a link lands on exactly what you were
   looking at. Written with replaceState: sharing works without every tab
   click becoming a history entry. Nothing here leaves the browser.       */
const VIEWS = ["ready", "near", "pool", "path", "tips", "about"];
let readingHash = false;

function writeHash() {
  if (readingHash) return;
  const q = new URLSearchParams();
  q.set("v", view);
  if (view === "pool") { if (pairA) q.set("a", pairA); if (pairB) q.set("b", pairB); }
  if (view === "path" && target) q.set("t", target);
  const top = drawerStack[drawerStack.length - 1];
  if (top) q.set(top.t === "crop" ? "crop" : "mpool", top.id);
  const h = "#" + q.toString();
  /* the other languages of this page are the same page, so switching keeps
     the tab, the pair and the open panel you are looking at */
  for (const a of document.querySelectorAll(".langs a")) a.hash = h;
  if (h === location.hash) return;
  // file:// rejects replaceState in some browsers; the page must still work
  try { history.replaceState(null, "", h); } catch (e) {}
}

/* Returns whether the url had anything to say, so the first load can tell
   whether the page still needs a render of its own. */
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (!q.get("v") && !q.get("crop")) return false;
  readingHash = true;
  const v = q.get("v"), a = q.get("a"), b = q.get("b"), t = q.get("t");
  if (VIEWS.includes(v)) view = v;
  if (a && C[a]) pairA = a;
  if (b && C[b]) pairB = b;
  if (pairA && pairB) recordPair(pairA, pairB);   // a shared link counts as a visit
  if (t && C[t]) target = t;
  readingHash = false;
  render();
  drawerStack = [];
  const crop = q.get("crop"), mp = q.get("mpool");
  if (crop && C[crop]) showCrop(crop);
  else if (mp && POOLM[mp]) showPool(mp);
  else closeDrawer();
  return true;
}

document.addEventListener("click", e => {
  const seed = e.target.closest(".seed-tick");
  if (seed) { toggle(seed.dataset.id); return; }
  const star = e.target.closest("[data-star]");
  if (star) { toggleSave(star.dataset.star); return; }
  const pair = e.target.closest("[data-pair]");
  if (pair) { setPair(...pair.dataset.pair.split("|")); render(); return; }
  const pool = e.target.closest("[data-pool]");
  if (pool) { showPool(pool.dataset.pool); return; }
  const crop = e.target.closest("[data-crop]");
  if (crop) { showCrop(crop.dataset.crop); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump) { $(jump.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const goview = e.target.closest("[data-goview]");
  if (goview) { view = goview.dataset.goview; render(); return; }
  /* last, so every button inside a card wins over marking it */
  const card = e.target.closest(".card[data-key]");
  if (card) { toggleMark(card.dataset.key); return; }
  if (e.target.id === "morePairs") { pairsOpen = !pairsOpen; render(); return; }
  if (e.target.id === "clearPair") { pairA = pairB = ""; render(); return; }
  const tab = e.target.closest(".tab");
  if (tab) { view = tab.dataset.view; render(); return; }
  if (e.target.id === "scrim") closeDrawer();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

$("search").addEventListener("input", e => { filter = e.target.value; renderRail(); });

/* Enter ticks the top match and clears the box, so a run of seeds can be
   entered without leaving the keyboard.                                   */
$("search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const first = railList()[0];
  if (!first) return;
  filter = ""; e.target.value = "";
  toggle(first.id);                       // toggle() saves and re-renders
  status(owned.has(first.id) ? `{{msg.added}}` : `{{msg.removed}}`, "ok");
});

$("clearAll").onclick = () => {
  if (!owned.size) return;
  snapshot(); owned.clear(); save(); render();
  status(`{{msg.cleared}}`, "warn");
};

$("undo").onclick = () => {
  if (undoState === null) return;
  const back = undoState;
  snapshot();                       // so Undo can be undone
  owned = new Set(back);
  save(); render();
  status(`{{msg.restored}}`, "ok");
};

/* --- export / import --- */
$("btnCopy").onclick = async () => {
  const box = $("code");
  box.value = currentCode();
  try {
    await navigator.clipboard.writeText(box.value);
    status(`{{msg.copied}}`, "ok");
  } catch (e) {
    box.focus(); box.select();
    status(`{{msg.clipboardBlocked}}`, "warn");
  }
};

$("btnLoad").onclick = () => applyImport($("code").value);

/* A sandboxed frame ignores <a download> silently instead of throwing, so the
   button is only offered when this page is the top-level document.          */
const embedded = (() => {
  try { return window.self !== window.top; } catch (e) { return true; }
})();

$("btnFile").onclick = () => {
  const stamp = new Date().toISOString().slice(0, 10);
  try {
    const url = URL.createObjectURL(new Blob([currentCode()], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = `cropsnh-seeds-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    status(`{{msg.downloaded}}`, "ok");
  } catch (e) {
    status(`{{msg.downloadRefused}}`, "warn");
  }
};

$("btnOpen").onclick = () => $("filein").click();
$("filein").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { $("code").value = r.result; applyImport(r.result); };
  r.onerror = () => status(`{{msg.fileUnreadable}}`, "warn");
  r.readAsText(f);
  e.target.value = "";
};

/* Only downloads are gated by the sandbox - the file picker still opens, so
   "Open file" stays available either way.                                    */
$("btnFile").hidden = embedded;
$("dlnote").hidden = !embedded;

/* clicking the box selects everything, so Ctrl+C always works */
$("code").addEventListener("focus", e => e.target.select());

if (!storage) {
  const w = $("storagewarn");
  w.hidden = false;
  w.textContent = embedded
    ? `{{warn.noStorageFramed}}`
    : `{{warn.noStorage}}`;
}

$("src").textContent = `{{head.src}}`;
/* The url is read before anything is drawn, because render() writes the url:
   rendering first would replace the link you arrived on with #v=ready, so a
   shared link or a reload always landed on the default view. */
if (!readHash()) render();
syncCode();
window.addEventListener("hashchange", readHash);
</script>
